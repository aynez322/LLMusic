[project]
name = "llmusic"
version = "2.0.0"
description = "Music recommendations from co-listening data and audio similarity"
requires-python = ">=3.10,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sse-starlette>=2.1.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "diskcache>=5.6.3",
    "rapidfuzz>=3.9.0",
    "numpy>=1.26.0",
    "miniaudio>=1.61",
    "torch>=2.4.0",
    "transformers>=4.45.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

# CPU-only PyTorch: the GPU build is ~2 GB larger and unused on Hugging Face's free tier.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api"]
